id = "server_helper"
name = "Server Helper"
version = "0.3.0"
description = "Auto-login and auto-register for offline servers with auth plugins: remembers your password per launcher, answers /login and /register prompts (the texts adjustable). Reports come as chat lines; the HUD is opt-in (/shud, a small panel in the bottom-right corner). All data stays on your PC."
authors = ["Sk0vorodka"]
api = "0.1"
side = "client"
capabilities = ["chat", "command", "hud", "storage"]
