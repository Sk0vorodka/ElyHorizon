version: 1.0.{build}
image: Visual Studio 2022
build: off
test: off

cache:
  # Keyed on the lockfiles, not on this file: a CI-config edit must not throw
  # a 40-minute build away. The caches re-key only when dependencies change.
  - '%USERPROFILE%\.cargo\registry -> Cargo.lock'
  - launcher\target -> launcher\Cargo.lock
  - target -> Cargo.lock

environment:
  matrix:
    - JOB: launcher
    - JOB: client

install:
  - appveyor DownloadFile https://win.rustup.rs/x86_64 -FileName rustup-init.exe
  - rustup-init.exe -y --profile minimal --default-toolchain stable

build_script:
  # Only the job whose files the push touched builds; the other one finishes
  # green in seconds (its note is on the build's Messages tab). The diff is
  # against the parent commit, so a multi-commit push sees its last commit
  # only - and so does this file (the launcher job; the client's long build
  # waits for code pushes). Documentation (docs/, site/ and any *.md) wakes
  # no job at all; NEW BUILD in the web UI forces both.
  - ps: |
      $ErrorActionPreference = 'Continue'
      $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
      # The launcher reports itself as its own tag (`horizon-launcher
      # --version`; the self-update compares tags): HORIZON_LAUNCHER_VERSION
      # alone would build the OLD launcher-v<version> tag shape, which sorts
      # below every launcher@ tag and loops the self-update forever.
      $env:HORIZON_LAUNCHER_TAG = "launcher@$($env:APPVEYOR_BUILD_VERSION)" 
      if ($env:APPVEYOR_FORCED_BUILD -eq 'True') {
        Write-Host "Forced build: building JOB=$($env:JOB) whatever changed."
      } else {
        $changed = @(git diff --name-only HEAD~1 HEAD 2>$null | Where-Object { $_ })
        $touched = if ($env:JOB -eq 'launcher') {
          $changed | Where-Object { $_ -like 'launcher/*' -or $_ -eq 'appveyor.yml' }
        } else {
          $changed | Where-Object {
            $_ -notlike 'launcher/*' -and
            $_ -notlike 'appveyor.yml' -and
            $_ -notlike 'docs/*' -and
            $_ -notlike 'site/*' -and
            $_ -notlike 'tools/*' -and
            $_ -notlike '*.md'
          }
        }
        if (-not $touched) {
          Write-Host "Skipped: nothing changed for JOB=$($env:JOB)."
          Add-AppveyorMessage "Nothing changed for JOB=$($env:JOB); its build is skipped."
          return
        }
      }
      # Cargo says its warnings to stderr, and in a PowerShell block a line in
      # stderr reads as an error (the runner merges stderr into its capture
      # and runs with ErrorActionPreference Stop): two finished builds died on
      # their own warnings already, and cmd in between does not help — its
      # child's stderr is cmd's too. The redirection happens inside the cmd
      # line (`2>&1`), so the warnings arrive as plain output, and the exit
      # code is checked after. The client builds with its code-mods runtime
      # (`horizon-client/mods`), and with the tools a version folder ships.
      $clean = if ($env:JOB -eq 'launcher') {
        # HORIZON_LAUNCHER_VERSION is read with option_env! at compile time:
        # cargo reuses a binary built without it unless the crate is forced
        # to recompile (the stamp then lands in --version and the
        # self-update's guard).
        'cargo clean -p horizon-launcher --manifest-path launcher/Cargo.toml 2>&1'
      } else {
        ''
      }
      if ($clean) {
        cmd /c $clean
      }
      $build = if ($env:JOB -eq 'launcher') {
        'cargo build --release --manifest-path launcher/Cargo.toml 2>&1'
      } else {
        'cargo build --release -p horizon-client --bin horizon-client --bin horizon-ctl -p horizon-server --bin horizon-server --features horizon-client/mods 2>&1'
      }
      cmd /c $build
      if ($LASTEXITCODE -ne 0) {
        throw "cargo build for JOB=$($env:JOB) exited with $LASTEXITCODE"
      }

artifacts:
  - path: launcher\target\release\horizon-launcher.exe
    name: horizon-launcher-windows
  - path: target\release\horizon-client.exe
    name: horizon-client-windows
  - path: target\release\horizon-ctl.exe
    name: horizon-ctl-windows
  - path: target\release\horizon-server.exe
    name: horizon-server-windows
